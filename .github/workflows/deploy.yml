name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Atļaut vienlaikus tikai vienu deploy
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build

      # SPA fallback nezināmiem ceļiem
      - run: cp dist/index.html dist/404.html

      # Statiskas lapas maršrutiem, lai tie atgriež HTTP 200 (nevis 404) SEO dēļ.
      # GitHub Pages servē privatuma-politika.html adresē /privatuma-politika ar statusu 200.
      - run: cp dist/index.html dist/privatuma-politika.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
